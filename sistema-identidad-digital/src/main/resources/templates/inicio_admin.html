<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel Asesor</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <div class="contenedor">
        <div class="tarjeta tarjeta-panel tarjeta-panel-grande">
            
            <div class="panel-header">
                <h1>Panel de Gestión - Registraduría</h1>
                <p>Bienvenido Asesor(a) <strong><span th:text="${ciudadano.nombre}"></span></strong>. Aquí puedes auditar todas las citas del sistema.</p>
                <hr>
            </div>

            <h3 style="color: #333; margin-bottom: 15px;">Listado General de Citas</h3>
            
            <!-- BOTÓN DESHACER (PATRÓN COMMAND) -->
            <div th:if="${hayComandosParaDeshacer != null and hayComandosParaDeshacer}" style="margin-bottom: 15px;">
                <form th:action="@{/admin/citas/deshacer}" method="post" style="display: inline;">
                    <button type="submit" class="boton" style="background-color: #ff9800; padding: 8px 15px; font-size: 14px; border: none; cursor: pointer;">
                        ↩️ Deshacer última cancelación
                    </button>
                </form>
            </div>
            
            <!-- Mensaje de éxito al cancelar o deshacer una cita (Añadimos clase 'alerta-mensaje') -->
            <div th:if="${mensajeExito}" class="alerta-mensaje" style="background-color: #d4edda; color: #155724; padding: 10px; border-radius: 5px; text-align: center; margin-bottom: 15px;">
                <span th:text="${mensajeExito}"></span>
            </div>
            
            <!-- Mensaje de error al intentar deshacer sin comandos previos o por bloqueo de seguridad (Añadimos clase 'alerta-mensaje') -->
            <div th:if="${mensajeError}" class="alerta-mensaje" style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; text-align: center; margin-bottom: 15px;">
                <span th:text="${mensajeError}"></span>
            </div>
            
            <table class="tabla-admin">
                <thead>
                    <tr>
                        <th>Cédula</th>
                        <th>Ciudadano</th>
                        <th>Fecha Trámite</th>
                        <th>Estado</th>
                        <th style="text-align: center;">Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cita : ${todasLasCitas}">
                        <td th:text="${cita.ciudadano.documento}"></td>
                        <td th:text="${cita.ciudadano.nombre + ' ' + cita.ciudadano.apellido}"></td>
                        <td th:text="${cita.fecha + ' a las ' + cita.hora}"></td>
                        <td>
                            <strong th:text="${cita.estado}" 
                                    th:style="${cita.estado == 'ASIGNADA' ? 'color: #28a745;' : (cita.estado == 'FINALIZADA' ? 'color: #007bff;' : 'color: #dc3545;')}">
                            </strong>
                        </td>
                        <!-- Botones de Acción (Atender y Cancelar) -->
                        <td style="text-align: center;">
                            <div style="display: flex; justify-content: center; gap: 10px;">
                                
                                <!-- Botón Atender: SOLO aparece si está ASIGNADA -->
                                <a th:if="${cita.estado == 'ASIGNADA'}" 
                                   th:href="@{/admin/citas/finalizar/{id}(id=${cita.id})}" 
                                   class="boton" 
                                   style="background-color: #28a745; padding: 6px 12px; font-size: 13px; text-decoration: none; color: white; border-radius: 4px;">
                                   Atender
                                </a>
                                
                                <!-- Botón Cancelar: Visible en ASIGNADA y en FINALIZADA (cebo para tu sustentación) -->
                                <form th:if="${cita.estado == 'ASIGNADA' or cita.estado == 'FINALIZADA'}" 
                                      th:action="@{/admin/citas/cancelar/{id}(id=${cita.id})}" method="post" style="margin: 0;">
                                    <button type="submit" class="boton" style="background-color: #dc3545; padding: 6px 12px; font-size: 13px; border: none; cursor: pointer; border-radius: 4px;">
                                        Cancelar
                                    </button>
                                </form>

                            </div>
                            <!-- Si la cita está cancelada, no mostramos botones -->
                            <span th:if="${cita.estado == 'CANCELADA'}" style="color: #888; font-size: 13px; font-style: italic;">No aplica</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(todasLasCitas)}">
                        <td colspan="5" style="text-align: center; color: #666;">El sistema no registra citas activas en este momento.</td>
                    </tr>
                </tbody>
            </table>

            <div style="margin-top: 40px; text-align: center;">
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="boton" style="background-color: #e02a2a; border: none; cursor: pointer; font-size: 16px;">Cerrar sesión</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Script para ocultar los mensajes de alerta después de 5 segundos -->
    <script>
        setTimeout(function() {
            var alertas = document.querySelectorAll('.alerta-mensaje');
            alertas.forEach(function(alerta) {
                alerta.style.display = 'none';
            });
        }, 5000); // 5000 ms = 5 segundos
    </script>
</body>
</html>
