<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel SuperAdmin</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <div class="contenedor">
        <div class="tarjeta tarjeta-panel">
            
            <div class="panel-header">
                <h1>Panel de Control Central</h1>
                <p>Bienvenido, <strong><span th:text="${ciudadano.nombre}"></span></strong> (SUPER ADMIN).</p>
                <hr>
            </div>

            
            
            <h3 style="text-align: center; margin-bottom: 20px; color: #333;">Registrar Nuevo Asesor</h3>

            <div th:if="${mensajeError}" style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; text-align: center; margin-bottom: 20px;">
                <span th:text="${mensajeError}"></span>
            </div>
            
            <div th:if="${mensajeExito}" style="background-color: #d4edda; color: #155724; padding: 10px; border-radius: 5px; text-align: center; margin-bottom: 20px;">
                <span th:text="${mensajeExito}"></span>
            </div>
            
            <form th:action="@{/crear-asesor}" method="post">
                <div class="campo">
                    <label>Nombre del Asesor:</label>
                    <input type="text" name="nombre" required placeholder="Ej: Camilo Perez">
                </div>
                <div class="campo">
                    <label>Correo Corporativo:</label>
                    <input type="email" name="email" required placeholder="ejemplo@gmail.com">
                </div>
                <div class="campo">
                    <label>Contraseña:</label>
                    <input type="password" name="password" required placeholder="Contraseña de acceso">
                </div>
                <button type="submit" class="boton" style="width: 100%; margin-top: 15px;">Crear Asesor Corporativo</button>
            </form>

            <div style="margin-top: 30px; text-align: center;">
    <form th:action="@{/logout}" method="post" style="display: inline;">
        <button type="submit" class="boton" style="background-color: #e02a2a; border: none; cursor: pointer; font-size: 16px;">Cerrar sesión</button>
    </form>
</div>
        </div>
    </div>
</body>
</html>
