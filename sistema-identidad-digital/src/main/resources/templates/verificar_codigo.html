<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar Código 2FA</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div class="contenedor">
    <div class="tarjeta">
        
        <!-- Lado izquierdo: logo -->
        <div class="lado-logo">
            <img th:src="@{/images/logo.png}" alt="Logo del Sistema" class="logo">
            <h1>Sistema de</h1>
            <h1>Identidad Digital</h1>
            <p>Acceso seguro a servicios gubernamentales</p>
        </div>

        <!-- Lado derecho: formulario -->
        <div class="lado-login">
            <h2>Ingresa tu código</h2>
            <p class="subtitulo">Revisa el medio que seleccionaste (Consola)</p>

            <div th:if="${param.error}" class="error">
                El código ingresado es incorrecto.
            </div>

            <form th:action="@{/login/validar-codigo}" method="post" style="margin-top: 20px;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="campo">
                    <label for="codigoIngresado">Código de 4 dígitos</label>
                    <input type="text" id="codigoIngresado" name="codigoIngresado" 
                           placeholder="Ej: 9482" maxlength="4" required autocomplete="off"
                           style="font-size: 24px; text-align: center; letter-spacing: 5px;">
                </div>

                <button type="submit" class="boton" style="margin-top: 15px;">Verificar y Entrar</button>
            </form>

            <div class="registro">
                <a href="/dos-pasos">Volver a pedir el código</a>
            </div>
        </div>

    </div>
</div>

</body>
</html>
