<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta</title>

    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

<div class="contenedor">

    <div class="tarjeta">

        <!-- Lado izquierdo -->
        <div class="lado-logo">

            <img src="/images/logo.png"
                 alt="Logo del Sistema de Identidad Digital"
                 class="logo">

            <h1>Sistema de</h1>
            <h1>Identidad Digital</h1>

            <p>
                Crea tu cuenta para acceder de forma segura
                a los servicios disponibles.
            </p>

        </div>


        <!-- Lado derecho -->
        <div class="lado-login">

            <h2>Crear cuenta</h2>

            <p class="subtitulo">
                Registra tus datos para comenzar
            </p>

            <div th:if="${error}" class="error">
                <p th:text="${error}"></p>
            </div>

            <form method="post" action="/registro" class="formulario-registro">

                <!-- Protección CSRF -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="campo">
                    <label for="nombre">Nombre</label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ingrese su nombre"
                        required>
                </div>

                <div class="campo">
                    <label for="apellido">Apellido</label>

                    <input
                        type="text"
                        id="apellido"
                        name="apellido"
                        placeholder="Ingrese su apellido"
                        required>
                </div>

                <div class="campo">
                    <label for="documento">Documento</label>

                    <input
                        type="text"
                        id="documento"
                        name="documento"
                        placeholder="Ingrese su documento"
                        required>
                </div>

                <div class="campo">
                    <label for="fechaNacimiento">
                        Fecha de nacimiento
                    </label>

                    <input
                        type="date"
                        id="fechaNacimiento"
                        name="fechaNacimiento"
                        required>
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono</label>

                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        placeholder="Ingrese su número de teléfono"
                        required>
                </div>

                <div class="campo">
                    <label for="email">Correo electrónico</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="correo@ejemplo.com"
                        required>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingrese una contraseña"
                        required>
                </div>

                <div class="campo">
                    <label for="confirmarPassword">
                        Confirmar Contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmarPassword"
                        name="confirmarPassword"
                        placeholder="Repita su contraseña"
                        required>
                </div>

                <button type="submit" class="boton">
                    Crear cuenta
                </button>

            </form>

            <div class="registro">

                <p>¿Ya tienes una cuenta?</p>

                <a href="/login">
                    Iniciar sesión
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
